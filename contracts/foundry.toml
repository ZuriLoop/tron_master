# Foundry runs the property-heavy test layer on EVM. Sources are identical to
# the Tron build; the only difference is the CREATE2 prefix, isolated behind
# PaymasterFactory._create2Prefix() (0x41 on TVM, overridden to 0xff in tests).
# The production artifact is built with tron-solc (see script/compile-tron.ts).

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test/foundry"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
bytecode_hash = "none"
remappings = [
  "@openzeppelin/tron-contracts/=lib/oz-tron/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "../sdk/vectors" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
